name: sandwich_shop
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: "^3.9.2"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  path_provider: ^2.0.15
  go_router: ^17.0.0
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  image: ^4.0.17
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - images/app_icon.png
    - images/chickenTeriyaki_footlong.png
    - images/chickenTeriyaki_six_inch.png
    - images/logo.png
    - images/meatballMarinara_footlong.png
    - images/meatballMarinara_six_inch.png
    - images/tunaMelt_footlong.png
    - images/tunaMelt_six_inch.png
    - images/veggieDelight_footlong.png
    - images/veggieDelight_six_inch.png
    - sandwiches.json

flutter_icons:
  android: true
  ios: true
  macos:
    generate: true
    image_path: "assets/images/logo.png"
  web:
    generate: true
    image_path: "assets/images/logo.png"
  windows:
    generate: true
    image_path: "assets/images/logo.png"
  image_path: "assets/images/logo.png"
